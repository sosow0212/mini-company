name: mini-company

# 프로파일로 분리한다. 개발 중엔 인프라만 컨테이너로 띄우고(make up)
# 앱은 호스트에서 실행하는 편이 반복 속도가 빠르다.
#   --profile infra     : mongo / milvus 스택만
#   --profile app       : 위 전부 + backend + frontend
#   --profile scheduler : 인프라 + backend + 주기 실행 워커(§10.2, K8s에선 CronJob)
#
# 인프라 서비스가 두 프로파일에 모두 속하는 이유: backend의 depends_on 대상이
# app 프로파일에 없으면 compose가 "undefined service"로 거부한다.

services:
  mongo:
    image: mongo:7.0
    profiles: [infra, app, scheduler]
    # standalone은 트랜잭션·change stream을 못 쓴다. 단일 노드라도 replica set으로 띄운다.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    # 호스트에 로컬 설치된 mongod가 127.0.0.1:27017을 점유하고 있으면, 호스트에서
    # localhost:27017로 붙는 프로세스가 이 컨테이너가 아닌 로컬 mongod에 조용히 붙는다.
    # 27018로 비켜서 어느 쪽에 붙는지 주소만 봐도 알 수 있게 한다.
    ports: ["27018:27017"]
    volumes: [mongo_data:/data/db]
    healthcheck:
      # rs.status()는 초기화 전에 예외를 던진다.
      # 즉 이 체크가 통과했다는 건 mongo-init까지 끝났다는 뜻이다.
      test: ["CMD", "mongosh", "--quiet", "--eval", "rs.status().ok"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 5s

  redis:
    image: redis:7.4-alpine
    profiles: [infra, app, scheduler]
    # 볼륨이 없다. 이벤트 버스는 유실을 허용한다(§10.2) — 재시작으로 잃는 것은
    # "그 순간 화면 갱신" 하나뿐이고, 진실은 Mongo에 있어 재연결 시 스냅샷으로 복구된다.
    # 영속성을 켜면 그 대가로 fsync 지연이 발행 경로에 얹힌다.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 2s

  # rs.initiate() 1회 실행 후 종료하는 one-shot 컨테이너.
  # 종료가 정상 동작이므로 healthcheck를 두지 않는다(다른 서비스는 필수).
  mongo-init:
    image: mongo:7.0
    profiles: [infra, app, scheduler]
    restart: "no"
    depends_on:
      mongo: { condition: service_started }
    entrypoint:
      - bash
      - -c
      - |
        until mongosh --host mongo --quiet --eval 'db.adminCommand("ping").ok' >/dev/null 2>&1; do sleep 1; done
        mongosh --host mongo --quiet --eval '
          try { rs.status().ok }
          catch (e) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo:27017"}]}) }
        '

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    profiles: [infra, app, scheduler]
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes: [etcd_data:/etcd]
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 6

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    profiles: [infra, app, scheduler]
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    volumes: [minio_data:/minio_data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 6

  milvus:
    image: milvusdb/milvus:v2.6.9
    profiles: [infra, app, scheduler]
    command: ["milvus", "run", "standalone"]
    security_opt: ["seccomp:unconfined"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MQ_TYPE: woodpecker
    volumes: [milvus_data:/var/lib/milvus]
    ports:
      - "19530:19530" # gRPC
      - "9091:9091" # /healthz, /metrics
    depends_on:
      etcd: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s

  backend:
    build:
      context: .
      dockerfile: deploy/docker/backend.Dockerfile
    profiles: [app, scheduler]
    env_file: [.env]
    environment:
      # .env는 호스트 기준 주소를 담고 있다. 컨테이너 안에서는 서비스명으로 붙는다.
      MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0
      MILVUS_HEALTH_URL: http://milvus:9091/healthz
      MILVUS_URI: http://milvus:19530
      # Ollama는 컨테이너가 아니라 호스트에서 돈다(모델 파일과 GPU/Metal 접근 때문에).
      # `.env`의 localhost는 컨테이너 안에서 자기 자신을 가리키므로 여기서 덮는다.
      # 켜는 것은 `.env`의 OLLAMA_ENABLED가 결정한다 — 주소만 바로잡는다.
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      REDIS_URL: redis://redis:6379/0
    extra_hosts:
      # 리눅스 순수 Docker에는 host.docker.internal이 없다. 이 줄이 만들어준다.
      - "host.docker.internal:host-gateway"
    ports: ["8000:8000"]
    depends_on:
      mongo: { condition: service_healthy }
      milvus: { condition: service_healthy }
      # EVENT_BUS=memory면 쓰지 않지만, 기다려도 몇 초다. 켠 뒤에 "왜 이벤트가 안 오지"로
      # 시작하는 디버깅보다 낫다.
      redis: { condition: service_healthy }
    healthcheck:
      # slim 이미지에 curl이 없다.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  # 주기 실행. K8s에서는 CronJob이 이 서비스를 대체한다(§10.2).
  # 기본 프로파일에 넣지 않는다 — `--profile scheduler`로 명시해야 뜬다. 개발 중에
  # 매일 11시를 기다릴 이유가 없고, 실수로 켜두면 원인 모를 작업이 생긴다.
  scheduler:
    build:
      context: .
      dockerfile: deploy/docker/worker.Dockerfile
    profiles: [scheduler]
    env_file: [.env]
    environment:
      BACKEND_BASE_URL: http://backend:8000
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: deploy/docker/frontend.Dockerfile
    profiles: [app]
    # nginx가 /api를 backend로 프록시한다 — 브라우저 기준 동일 출처가 되어 CORS가 필요 없다.
    ports: ["5173:8080"]
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      # localhost가 아니라 127.0.0.1이다 — 컨테이너 안에서 localhost는 ::1로 먼저
      # 해석되고 nginx는 IPv4만 listen하므로 연결이 거부된다(응답은 정상인데 unhealthy).
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

volumes:
  mongo_data: {}
  etcd_data: {}
  minio_data: {}
  milvus_data: {}
