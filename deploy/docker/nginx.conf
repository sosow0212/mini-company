server {
    # nginx-unprivileged는 non-root라 80을 바인딩할 수 없다.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # SPA가 아니라 단일 페이지이므로 fallback 하나로 충분하다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 정적 자산은 해시가 붙어 나오므로 길게 캐시한다. index.html은 위 location이 처리한다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 백엔드를 같은 출처로 붙인다 — 그래서 백엔드에 CORS를 열 필요가 없다.
    # 개발 서버(vite proxy)와 같은 역할이라 프론트 코드가 환경을 구분하지 않는다.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 업그레이드. 이 두 줄이 없으면 /api/v1/ws/office가 400으로 끊긴다.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # 이벤트가 드물게 오는 구간에서 nginx가 먼저 끊지 않도록 넉넉히 둔다.
        proxy_read_timeout 3600s;
    }
}
