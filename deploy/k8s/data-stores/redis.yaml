# 이벤트 버스(ADR-008). replica 2 이상에서 필수다.
#
# **StatefulSet이 아니라 Deployment인 이유**: 남길 게 없다. Pub/Sub은 발행 시점에 붙어
# 있는 구독자에게만 전달하고 저장하지 않는다 — 재시작으로 잃는 것은 "그 순간의 화면
# 갱신" 하나뿐이고, 진실은 Mongo에 있어 재연결 시 스냅샷으로 복구된다(§12).
# 안정적 이름도 필요 없다. Mongo는 rs 멤버가 호스트명으로 등록돼 StatefulSet이어야 했지만
# 여기서는 Service 하나면 충분하다.
#
# **readiness에서 backend가 redis를 확인하지 않는 이유**: redis가 죽어도 앱은 답한다.
# 이벤트만 멈춘다. readiness에 넣으면 버스 장애가 전체 트래픽 차단으로 번진다 —
# 유실을 허용하기로 한 컴포넌트가 가용성의 발목을 잡는 셈이다.
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector: { app: redis }
  ports:
    - { name: redis, port: 6379 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
      containers:
        - name: redis
          image: redis:7.4-alpine
          # 영속화를 끈다. 켜두면 fsync 지연이 발행 경로에 얹히는데, 그렇게 지킨
          # 데이터를 쓸 곳이 없다(구독자는 재시작 중 끊겨 있었다).
          args: ["redis-server", "--save", "", "--appendonly", "no"]
          ports:
            - { name: redis, containerPort: 6379 }
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
