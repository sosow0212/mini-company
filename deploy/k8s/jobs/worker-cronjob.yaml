# 주기 작업. **APScheduler를 대체한다**(§10.2).
#
# 로컬에서는 `workers/src/scheduler.py`가 상시 프로세스로 돌지만, K8s에서는 CronJob이
# 그 역할을 한다 — 스케줄 관리를 애플리케이션이 아니라 플랫폼에 맡기는 편이 낫다:
#   - 스케줄이 매니페스트에 있어 `kubectl get cronjob`으로 보인다(로그를 뒤지지 않아도 된다)
#   - 스케줄러 프로세스가 죽어도 다음 실행이 온다(상시 프로세스는 죽으면 그걸로 끝이다)
#   - 실행마다 새 Pod라 메모리 누수가 누적되지 않는다
#
# Phase 9에서 잡 본체(`collector.run`)와 스케줄링(`scheduler.py`)을 분리해둔 이유가 이것이다.
# **`scheduler.py`를 지우지 않는다** — 로컬 개발에서는 kind를 띄우지 않고 `make scheduler`로
# 같은 동작을 확인하는 게 빠르고, 두 경로가 같은 함수를 호출하므로 갈라지지 않는다.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: collector
spec:
  # 매일 오전 11시. 아래 timeZone이 없으면 UTC로 해석되어 한국 시간 20시에 돈다.
  schedule: "0 11 * * *"
  # k8s 1.27+ 필수 기능. 이게 없는 클러스터에서는 CRON_TZ= 접두어를 쓴다.
  timeZone: "Asia/Seoul"
  # 앞 실행이 아직 돌고 있으면 새로 띄우지 않는다. 같은 직원에게 두 작업을 시키면
  # EmployeeBusy(409)가 나므로, APScheduler의 max_instances=1과 같은 판단이다.
  concurrencyPolicy: Forbid
  # 클러스터가 잠깐 멈췄다 살아난 경우, 이 시간 안이면 놓친 실행을 따라잡는다.
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      # 작업이 무한정 매달리면 다음 스케줄까지 Forbid로 막힌다. 워커가 죽어 생기는
      # RUNNING 잔류는 백엔드 회수 루프가 정리하지만(Phase 9), Job 자체도 한계가 필요하다.
      activeDeadlineSeconds: 900
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          containers:
            - name: collector
              image: mini-company/worker:0.1.0
              imagePullPolicy: IfNotPresent
              # 스케줄러가 아니라 잡 본체를 한 번 실행한다. 이미지의 기본 CMD는
              # 상시 스케줄러이므로 여기서 덮는다.
              command: ["python", "-m", "src.employees.collector"]
              env:
                - { name: BACKEND_BASE_URL, value: "http://backend:8000" }
                - { name: LOG_FORMAT, value: json }
                - { name: EMPLOYEE_NAME, value: "수집가 노아" }
              envFrom:
                # 워커가 필요한 것은 WORKER_API_KEY 하나지만, 같은 Secret을 쓰면
                # 키 로테이션이 백엔드와 자동으로 맞는다.
                - secretRef: { name: backend-secret }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 256Mi }
