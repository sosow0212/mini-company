# **실제 Secret은 커밋하지 않는다.** 이 파일은 어떤 키가 필요한지 보여주는 예시다.
#
# `.env.example`에서 `[SECRET]` 표시가 붙은 항목이 전부 여기 있어야 한다. 코드에서는
# `Settings`의 `SecretStr` 타입이 같은 구분을 강제한다 — 타입만 봐도 어디로 가는지 안다.
#
# 적용:
#   kubectl -n mini-company create secret generic backend-secret \
#     --from-literal=WORKER_API_KEY="$(openssl rand -hex 32)" \
#     --from-literal=MINIMAX_API_KEY=... \
#     --from-literal=OPENAI_API_KEY=...
#
# 키 로테이션 무중단 교체(§8.6):
#   1. kubectl create secret ... --dry-run=client -o yaml | kubectl apply -f -
#   2. kubectl rollout restart deployment/backend
#   3. kubectl rollout status deployment/backend   ← 롤링이 끝날 때까지 옛 Pod가 응답한다
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
type: Opaque
stringData:
  # APP_ENV != local이면 이 값이 change-me면 부팅을 거부한다(§15 검증 6).
  WORKER_API_KEY: "replace-me-with-openssl-rand-hex-32"
  # 비워 두면 해당 프로파일이 호출 불가 상태로 남고 부팅 시 경고가 나온다.
  MINIMAX_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  # EMBEDDING_PROVIDER=openai일 때만 필요하다.
  OPENAI_API_KEY: ""
