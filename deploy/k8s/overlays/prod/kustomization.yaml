# Phase 11 — DB까지 클러스터 안으로. "프로덕션에 가까운 구성"이라는 뜻이고,
# 검증은 kind에서 한다(실제 프로덕션 클러스터는 이 overlay를 그대로 쓰거나 복제한다).
#
# base와의 차이:
#   - StatefulSet DB(mongo/etcd/minio/milvus)와 rs 초기화 Job을 포함한다
#   - CronJob 워커를 포함한다 — 로컬 APScheduler를 플랫폼 스케줄러로 대체
#   - DB 주소가 클러스터 내부 서비스명을 가리킨다
#
# **backend replica가 2다**(Phase 12). RedisEventBus가 들어왔기 때문에 가능해졌다 —
# 그 전에 2로 올렸다면 "가끔 화면이 안 갱신되는" 버그가 기본 동작이 됐을 것이다(ADR-008).
#
# frontend는 1로 둔다. 정적 파일 서빙이라 늘릴 이유가 없고, 늘려도 배울 게 없다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mini-company

resources:
  - ../../base
  - ../../data-stores
  - ../../jobs

replicas:
  - { name: backend, count: 2 }
  - { name: frontend, count: 1 }

patches:
  - path: cluster-db-patch.yaml
