# 클러스터 안 DB를 가리킨다.
#
# `mongo-0.mongo`는 StatefulSet Pod의 안정적 DNS 이름이다(headless Service 덕분).
# `?directConnection=true`가 필요한 이유: rs 멤버가 이 이름으로 등록되어 있고,
# `replicaSet=rs0`로 붙으면 드라이버가 멤버 목록을 다시 해석하며 한 홉을 더 돈다.
# 단일 멤버에서는 직결이 단순하고, 직결이어도 rs 멤버이므로 트랜잭션은 그대로 쓸 수 있다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  template:
    spec:
      containers:
        - name: backend
          env:
            - name: MONGO_URI
              value: mongodb://mongo-0.mongo:27017/?directConnection=true
            - name: MILVUS_URI
              value: http://milvus:19530
            - name: MILVUS_HEALTH_URL
              value: http://milvus:9091/healthz
            # replica가 2이므로 필수다(ADR-008). memory로 두면 WS가 붙은 Pod와
            # 상태를 바꾼 Pod가 다를 때 그 사용자만 화면이 멈춘다 — 재현이 간헐적이라
            # 가장 찾기 어려운 형태의 버그다.
            - name: EVENT_BUS
              value: redis
            - name: REDIS_URL
              value: redis://redis:6379/0
