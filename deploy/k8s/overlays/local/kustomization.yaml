# Phase 10 — **앱만** 클러스터에 올리고 DB는 호스트 compose에 남긴다.
#
# blueprint §10.3이 이 순서를 권하는 이유: 앱과 스토리지를 동시에 K8s로 옮기면 문제가
# 났을 때 원인이 어느 쪽인지 알 수 없다. 여기서는 "앱이 K8s에서 뜨는가"만 확인한다.
#
# 준비: make up   (호스트에 mongo:27018 / milvus:19530이 떠 있어야 한다)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mini-company

resources:
  - ../../base

# replica 1이다. EVENT_BUS=memory에서 2로 올리면 어떤 클라이언트는 WS 이벤트를 받지
# 못한다(ADR-008). replica 2는 Redis가 들어오는 overlays/prod에서 시도한다.
replicas:
  - { name: backend, count: 1 }
  - { name: frontend, count: 1 }

patches:
  - path: host-db-patch.yaml
  - path: app-env-patch.yaml
