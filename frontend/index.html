<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mini-company — AI 직원 관제 센터</title>
    <meta name="description" content="AI 직원을 채용하고 관제하는 모던 3D 오피스 대시보드" />
    <!-- Google Fonts for modern clean typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <h1 class="brand">
          mini<span class="brand__dim">-company</span>
          <span class="brand__tag">관제 센터</span>
        </h1>

        <p class="topbar__lead">
          AI 직원을 채용하여 임무를 부여하면, 직원이 워크플로우를 수행하고 리포트를 생성합니다.
        </p>

        <div class="topbar__right">
          <p id="connection-badge" class="badge" data-state="down">연결 중</p>
          <button type="button" id="directory-button" class="button button--ghost">
            👥 직원 목록
          </button>
          <button type="button" id="hire-button" class="button button--primary">
            + 직원 채용
          </button>
        </div>
      </header>

      <main class="stage" aria-label="3D 오피스">
        <div id="scene-host" class="scene-host"></div>

        <div id="empty-state" class="empty-state" hidden>
          <h2>사무실이 비어 있습니다</h2>
          <p>
            상단 <strong>+ 직원 채용</strong> 버튼으로 첫 AI 직원을 배치하세요.<br />
            직원 아바타를 클릭하면 일을 시키거나 수행 이력을 확인할 수 있습니다.
          </p>
        </div>

        <p id="boot-error" class="boot-error" role="alert" hidden></p>
      </main>

      <aside class="rail" aria-label="관제 패널">
        <section id="ledger-panel" class="panel" aria-label="원장 요약"></section>
        <!--
          작업·반복 지시·지식을 탭으로 묶는다. 세로로 쌓으면 원장까지 넷이 되어
          레일 높이를 넘고, 아래 패널은 스크롤해야 보인다 — 보이지 않는 것은 없는 것과
          같다는 걸 이미 한 번 겪었다.
        -->
        <div class="rail__tabs" role="tablist" aria-label="관제 탭">
          <button type="button" role="tab" data-tab="task" aria-selected="true">작업</button>
          <button type="button" role="tab" data-tab="schedule" aria-selected="false">
            반복 지시
          </button>
          <button type="button" role="tab" data-tab="knowledge" aria-selected="false">
            지식
          </button>
        </div>
        <section
          id="task-panel"
          class="panel"
          data-tabpanel="task"
          role="tabpanel"
          aria-label="작업 목록"
        ></section>
        <!--
          반복 지시: "매일 09:00 자료 수집" 같은 규칙. 시각이 되면 백엔드가 작업을
          만들고 에이전트가 집어간다 — 사람이 직접 시킨 일과 같은 경로다.
        -->
        <section
          id="schedule-panel"
          class="panel"
          data-tabpanel="schedule"
          role="tabpanel"
          aria-label="반복 지시"
          hidden
        ></section>
        <!--
          지식 베이스: 수집 작업이 실제로 무엇을 적재했는지. RAG 챗봇이 근거로 쓰는
          바로 그 목록이라, 여기가 비어 있으면 챗봇도 "자료에 없습니다"만 답한다.
        -->
        <section
          id="knowledge-panel"
          class="panel"
          data-tabpanel="knowledge"
          role="tabpanel"
          aria-label="지식 베이스"
          hidden
        ></section>
        <p class="rail__hint">
          💡 직원을 클릭하거나 상단 <strong>직원 목록</strong>을 누르면 직원 정보와 작업 이력을 볼 수 있습니다.
        </p>
      </aside>
    </div>

    <!-- 직원 상세 슬라이드오버 드로어 (Employee Detail Drawer) -->
    <div id="drawer-backdrop" class="drawer-backdrop"></div>
    <aside id="employee-drawer" class="drawer" aria-label="직원 상세 슬라이드오버" hidden></aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
