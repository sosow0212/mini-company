[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mini-company-backend"
version = "0.1.0"
description = "AI 직원 관제실 백엔드"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",
    "pydantic-settings>=2.14",
    "pymongo>=4.15",
    "beanie>=2.1",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "ruff>=0.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
