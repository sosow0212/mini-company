[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mini-company-backend"
version = "0.1.0"
description = "AI 직원 관제실 백엔드"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",
    "pydantic-settings>=2.14",
    "pymongo>=4.15",
    "beanie>=2.1",
    "httpx>=0.28",
    # Milvus 클라이언트. 서버(v2.6.9)와 minor를 맞춘다.
    "pymilvus>=2.6.17,<3",
    # 문서 파서. 직접 구현하면 엣지케이스에서 조용히 깨진다.
    "pypdf>=5.1",
    "beautifulsoup4>=4.12",
    # 다중 replica 이벤트 버스(ADR-008). asyncio 지원이 패키지에 들어 있어 별도 라이브러리가 없다.
    "redis>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "ruff>=0.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
# 문서 파서·청커는 전각 문장부호(？！。)를 의도적으로 다룬다. 한국어·일본어 문서에서
# 실제로 쓰이고, 빼면 그 문서의 문장 경계를 찾지 못한다.
"src/knowledge/chunking/base.py" = ["RUF001"]
